# Recognizer registry for French text.
# Predefined generic recognizers default to English: each one must be declared
# for "fr" explicitly, otherwise it is silently skipped for French requests.
supported_languages:
  - fr
global_regex_flags: 26  # re.DOTALL | re.MULTILINE | re.IGNORECASE

recognizers:
  - name: CreditCardRecognizer
    type: predefined
    supported_languages:
      - language: fr
        context: [carte, bancaire, cb, visa, mastercard, amex, paiement, crédit]

  - name: EmailRecognizer
    type: predefined
    supported_languages:
      - language: fr
        context: [mail, e-mail, courriel, adresse, contact]

  - name: PhoneRecognizer
    type: predefined
    supported_languages:
      - language: fr
        context: [téléphone, tél, tel, portable, mobile, fixe, appeler, joindre, numéro]

  - name: IbanRecognizer
    type: predefined
    supported_languages:
      - language: fr
        context: [iban, rib, virement, compte, bancaire]

  - name: IpRecognizer
    type: predefined
    supported_languages:
      - language: fr

  # NER-based PERSON / LOCATION / ORGANIZATION from the French spaCy model.
  - name: SpacyRecognizer
    type: predefined
    supported_languages:
      - language: fr

  # French social security number (NIR), with control-key validation:
  # Python class in presidio/recognizers/fr_nir_recognizer.py, installed by the Dockerfile.
  - name: FrNirRecognizer
    type: predefined
    supported_languages:
      - language: fr
