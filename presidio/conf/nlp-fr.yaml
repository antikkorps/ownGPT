# spaCy NLP engine for French. The model name is rewritten at build time
# from the SPACY_MODEL build arg (fr_core_news_md by default, lg optional).
nlp_engine_name: spacy
models:
  - lang_code: fr
    model_name: fr_core_news_md

ner_model_configuration:
  # French spaCy models emit PER / LOC / ORG / MISC.
  model_to_presidio_entity_mapping:
    PER: PERSON
    LOC: LOCATION
    ORG: ORGANIZATION
  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
    - ORGANIZATION
  # MISC is far too noisy in French (product names, events, nationalities).
  labels_to_ignore:
    - MISC
